
name: Build TAN DUC AUTO POSTER APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check and extract ZIP
        run: |
          ls -lah
          unzip -t TAN_DUC_AUTO_POSTER_ANDROID_V1_CLOUD_BUILD.zip
          mkdir extracted
          unzip -q TAN_DUC_AUTO_POSTER_ANDROID_V1_CLOUD_BUILD.zip -d extracted
          test -f extracted/TAN_DUC_AUTO_POSTER_ANDROID_V1/settings.gradle

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        run: |
          cd extracted/TAN_DUC_AUTO_POSTER_ANDROID_V1
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TAN-DUC-AUTO-POSTER-APK
          path: extracted/TAN_DUC_AUTO_POSTER_ANDROID_V1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
